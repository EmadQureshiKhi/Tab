# Logical secret names the workflow reads with `runtime.getSecret`, mapped to
# the environment variable that carries each value. In simulation the value
# comes from the shell or a `.env`; deployed, from the Vault DON (`cre secrets`).
#
# The two names differ on purpose. `KEEPER_SHARED_SECRET` is the secret's own
# id, which is what the workflow asks the Vault for and what `cre secrets`
# stores it under. `CRE_KEEPER_SHARED_SECRET` is only where a simulation reads
# the value from, and the simulator warns when the two are spelled the same,
# because then it is not apparent which of them a change is changing. The
# keeper process reads `KEEPER_SHARED_SECRET`; both must carry the same value,
# and `pnpm env:bootstrap` writes them together.
secretsNames:
  KEEPER_SHARED_SECRET:
    - CRE_KEEPER_SHARED_SECRET
