# Tab spike 1.3 — throwaway Foundry project for `Probe.sol`.
#
# `spike/` is exploration scope, so it gets its own tiny project rather than
# borrowing the product Foundry project under `packages/contracts/`. Nothing
# here is deployed twice and nothing here is imported by product code.
#
# `libs` is deliberately empty: auto-scanning `node_modules` for Solidity
# sources is slow and imprecise. The two remappings below name exactly the two
# trees this probe reads, and `allow_paths` grants the compiler permission to
# read them even though they sit above this project root.
[profile.default]
src = "."
out = "out"
cache_path = "cache"
libs = []

solc_version = "0.8.23"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

# The probe takes one deeply nested calldata struct — a Merkle path of structs plus a Continuity
# Proof plus the encoded transaction — and the legacy code generator runs out of addressable stack
# slots decoding it. `via_ir` is the documented remedy. It is set here and *not* in the product
# Foundry project, so it changes nothing about how `SettlementVerifier` will be compiled. The one
# figure this spike exports for task 1.4, the gas consumed by `verifyAndEmit`, is a `gasleft()`
# delta across a precompile call and is not sensitive to the caller's codegen pipeline.
via_ir = true

remappings = [
    "@gluwa/usc-contracts/=../node_modules/@gluwa/usc-contracts/",
    "@tabai-contracts/=../packages/contracts/src/",
]
allow_paths = ["../node_modules", "../packages"]
